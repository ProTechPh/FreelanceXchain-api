<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Released - FreelanceXchain</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background-color: #f5f7fa;">
    <table role="presentation" style="width: 100%; border-collapse: collapse; background-color: #f5f7fa;">
        <tr>
            <td align="center" style="padding: 40px 20px;">
                <table role="presentation" style="max-width: 600px; width: 100%; border-collapse: collapse; background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
                    <!-- Header -->
                    <tr>
                        <td style="padding: 40px 40px 30px; text-align: center; background: linear-gradient(135deg, #48bb78 0%, #38a169 100%); border-radius: 12px 12px 0 0;">
                            <div style="font-size: 48px; margin-bottom: 10px;">💸</div>
                            <h1 style="margin: 0; color: #ffffff; font-size: 28px; font-weight: 700; letter-spacing: -0.5px;">
                                Payment Released
                            </h1>
                            <p style="margin: 10px 0 0; color: #d1fae5; font-size: 14px;">
                                Hi {{ recipientName }}
                            </p>
                        </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td style="padding: 40px;">
                            <h2 style="margin: 0 0 20px; color: #1a202c; font-size: 24px; font-weight: 600;">
                                Your payment is on its way 🎉
                            </h2>

                            <p style="margin: 0 0 20px; color: #4a5568; font-size: 16px; line-height: 1.6;">
                                A payment of <strong style="color: #2f855a; font-size: 20px;">{{ amount }}</strong>
                                for <strong style="color: #1a202c;">"{{ contractTitle }}"</strong> has been released.
                            </p>

                            <!-- Amount Box -->
                            <div style="margin: 25px 0; padding: 20px; background-color: #f0fff4; border-radius: 8px; border-left: 4px solid #48bb78; text-align: center;">
                                <p style="margin: 0 0 5px; color: #718096; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">
                                    Released Amount
                                </p>
                                <p style="margin: 0; color: #2f855a; font-size: 32px; font-weight: 700;">
                                    {{ amount }}
                                </p>
                                <p style="margin: 10px 0 0; color: #a0aec0; font-size: 11px; word-break: break-all;">
                                    Tx: {{ transactionHash }}
                                </p>
                            </div>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding: 30px 40px; background-color: #f7fafc; border-radius: 0 0 12px 12px; border-top: 1px solid #e2e8f0;">
                            <p style="margin: 0 0 10px; color: #718096; font-size: 12px; text-align: center;">
                                © 2025 FreelanceXchain. All rights reserved.
                            </p>
                            <p style="margin: 0; color: #a0aec0; font-size: 11px; text-align: center;">
                                Secure blockchain-powered freelance marketplace
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
