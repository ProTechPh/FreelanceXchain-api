<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - FreelanceXchain</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background-color: #f8fafc; color: #0f172a; -webkit-font-smoothing: antialiased;">
    <table role="presentation" style="width: 100%; border-collapse: collapse; background-color: #f8fafc; padding: 40px 16px;">
        <tr>
            <td align="center" style="padding: 32px 12px;">
                <table role="presentation" style="max-width: 620px; width: 100%; border-collapse: collapse;">
                    <tr>
                        <td align="center" style="padding-bottom: 24px;">
                            <div style="display: inline-block; background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 9999px; padding: 10px 24px; box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.05);">
                                <span style="font-size: 19px; font-weight: 800; color: #0f172a; letter-spacing: -0.5px; line-height: 1;">
                                    Freelance<span style="color: #10b981; font-weight: 900;">X</span>chain
                                </span>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td style="background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 32px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);">
                            <div style="display: inline-block; background-color: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 9999px; padding: 6px 16px; margin-bottom: 18px;">
                                <span style="color: #065f46; font-size: 12px; font-weight: 700;">Contract update &bull; Action may be required</span>
                            </div>
                            <h1 style="margin: 0 0 12px; font-size: 26px; font-weight: 800; color: #0f172a; letter-spacing: -0.5px; line-height: 1.3;">
                                {{ title }}
                            </h1>
                            <p style="margin: 0 0 8px; font-size: 15px; color: #475569; line-height: 1.6;">
                                Hi <strong>{{ recipientName }}</strong>,
                            </p>
                            <p style="margin: 0 0 24px; font-size: 15px; color: #475569; line-height: 1.6;">
                                {{ message }}
                            </p>
                            <div style="margin: 0 0 8px;">
                                <a href="{{ ctaUrl }}" target="_blank" style="display: inline-block; padding: 14px 32px; background-color: #064e3b; color: #ffffff; font-size: 15px; font-weight: 700; text-decoration: none; border-radius: 9999px; box-shadow: 0 4px 14px rgba(6, 78, 59, 0.3);">
                                    Open contract &rarr;
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding: 20px 16px 0; font-size: 12px; color: #94a3b8; line-height: 1.6;">
                            You receive this email because you are a party to a contract on FreelanceXchain.
                            Manage contract emails in your notification settings.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
