name: Smart Contracts CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'contracts/**'
      - 'hardhat.config.cjs'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'hardhat.config.cjs'

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden-Runner
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit
          allowed-endpoints: >
            binaries.soliditylang.org:443
            github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            nodejs.org:443

      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Hardhat compiler
        uses: actions/cache@v6
        with:
          path: ~/.cache/hardhat-nodejs
          key: ${{ runner.os }}-hardhat-${{ hashFiles('hardhat.config.cjs') }}
          restore-keys: |
            ${{ runner.os }}-hardhat-

      - name: Compile smart contracts
        run: pnpm run compile

  slither:
    runs-on: ubuntu-latest
    steps:
      - name: Harden-Runner
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            nodejs.org:443

      - uses: actions/checkout@v7

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          target: 'contracts/'
          slither-args: '--exclude-dependencies'
          fail-on: high
