name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden-Runner
        uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit
          allowed-endpoints: >
            binaries.soliditylang.org:443
            github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            nodejs.org:443
            codecov.io:443

      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Hardhat compiler
        uses: actions/cache@v6
        with:
          path: ~/.cache/hardhat-nodejs
          key: ${{ runner.os }}-hardhat-${{ hashFiles('hardhat.config.cjs') }}
          restore-keys: |
            ${{ runner.os }}-hardhat-

      - name: Compile smart contracts (optional - network may not be available in CI)
        continue-on-error: true
        run: |
          pnpm run compile
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Type check
        run: pnpm exec tsc --noEmit
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Lint
        run: pnpm run lint
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: OpenAPI spec drift check
        run: pnpm run openapi:check
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden-Runner
        uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit
          allowed-endpoints: >
            binaries.soliditylang.org:443
            github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            nodejs.org:443
            codecov.io:443

      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Hardhat compiler
        uses: actions/cache@v6
        with:
          path: ~/.cache/hardhat-nodejs
          key: ${{ runner.os }}-hardhat-${{ hashFiles('hardhat.config.cjs') }}
          restore-keys: |
            ${{ runner.os }}-hardhat-

      - name: Compile smart contracts (optional - network may not be available in CI)
        continue-on-error: true
        run: |
          pnpm run compile
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Run tests
        run: pnpm run test:ci
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden-Runner
        uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit
          allowed-endpoints: >
            binaries.soliditylang.org:443
            github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            nodejs.org:443

      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Hardhat compiler
        uses: actions/cache@v6
        with:
          path: ~/.cache/hardhat-nodejs
          key: ${{ runner.os }}-hardhat-${{ hashFiles('hardhat.config.cjs') }}
          restore-keys: |
            ${{ runner.os }}-hardhat-

      - name: Compile smart contracts (optional - network may not be available in CI)
        continue-on-error: true
        run: |
          pnpm run compile
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Build
        run: pnpm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
